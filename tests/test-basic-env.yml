name: Test basic pinned version with env loading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove repo lockfile so it does not interfere with the test config
        run: rm -f "$GITHUB_WORKSPACE/mise.lock" "$GITHUB_WORKSPACE/.mise.toml"
      - id: mise
        uses: .
        with:
          cache: false
          install: false
          version: 2025.7.3
          sha256: d38d4993c5379a680b50661f86287731dc1d1264777880a79b786403af337948
          mise_dir: ${{ runner.temp }}/mise-basic-data
          mise_toml: |
            [env]
            MY_ENV_VAR = "abc"
      - name: Assert mise is on PATH with the pinned version
        run: |
          which mise || { echo "FAIL: mise not on PATH"; exit 1; }
          V="$(mise --version)"
          echo "mise --version: $V"
          if ! echo "$V" | grep -q "2025.7.3"; then
            echo "FAIL: expected mise 2025.7.3"
            exit 1
          fi
          echo "PASS"
      - name: Assert mise.toml was written to the action's working directory
        run: |
          F="$GITHUB_WORKSPACE/mise.toml"
          if [ ! -f "$F" ]; then
            echo "FAIL: $F not found"
            exit 1
          fi
          cat "$F"
          grep -q 'MY_ENV_VAR = "abc"' "$F" || { echo "FAIL: content missing"; exit 1; }
          echo "PASS"
      - name: Assert env var exported
        run: |
          echo "MY_ENV_VAR: ${MY_ENV_VAR:-}"
          if [ "${MY_ENV_VAR:-}" != "abc" ]; then
            echo "FAIL: expected MY_ENV_VAR=abc"
            exit 1
          fi
          echo "PASS"
      - name: Assert MISE_DATA_DIR exported
        env:
          EXPECTED: ${{ runner.temp }}/mise-basic-data
        run: |
          echo "MISE_DATA_DIR: ${MISE_DATA_DIR:-}"
          if [ "${MISE_DATA_DIR:-}" != "$EXPECTED" ]; then
            echo "FAIL: expected MISE_DATA_DIR=$EXPECTED"
            exit 1
          fi
          echo "PASS"
