name: Test tool_versions and install_args inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool_versions: |
            node 20.0.0
          install_args: "node"
          cache: "false"
          log_level: "info"
      - name: Assert node is available
        run: |
          which node || (echo "FAIL: node not found in PATH" && exit 1)
          NODE_VERSION=$(node --version 2>&1)
          echo "node version: $NODE_VERSION"
          echo "PASS: node is available"
