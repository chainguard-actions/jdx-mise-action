name: Test install tool via tool_versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: mise
        uses: .
        with:
          cache: false
          install_args: jq
          tool_versions: |
            jq 1.7.1
      - name: Assert .tool-versions written
        run: |
          f="$GITHUB_WORKSPACE/.tool-versions"
          cat "$f" || { echo "FAIL: .tool-versions not found"; exit 1; }
          grep -q '^jq 1.7.1' "$f" || { echo "FAIL: .tool-versions content missing"; exit 1; }
          echo "PASS"
      - name: Assert jq installed via mise
        run: |
          out="$(mise x jq -- jq --version)"
          echo "jq version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert jq output
        env:
          JQ: ${{ steps.mise.outputs.jq }}
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "jq: $JQ"
          echo "versions: $VERSIONS"
          if [ "$JQ" != "1.7.1" ]; then
            echo "FAIL: expected jq output 1.7.1"
            exit 1
          fi
          echo "PASS"
