name: Test mise with tool-versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool_versions: |
            node 22.0.0
          cache: "false"
          install: "true"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert .tool-versions file was written
        run: |
          if [ ! -f ".tool-versions" ]; then
            echo "FAIL: .tool-versions file not found"
            exit 1
          fi
          echo "Contents of .tool-versions:"
          cat .tool-versions
          if ! grep -q "node" .tool-versions; then
            echo "FAIL: .tool-versions does not contain 'node'"
            exit 1
          fi
          echo "PASS: .tool-versions file exists and contains node"
      - name: Assert node is installed via mise
        run: |
          NODE_VERSION=$(mise exec -- node --version 2>&1 || true)
          echo "node version via mise: $NODE_VERSION"
          if [ -z "$NODE_VERSION" ]; then
            echo "FAIL: node not installed via mise"
            exit 1
          fi
          echo "PASS: node is available via mise: $NODE_VERSION"
