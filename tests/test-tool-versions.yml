name: Test tool_versions with install_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: mise
        uses: .
        with:
          cache: false
          install_args: jq
          tool_versions: |
            jq 1.7.1
      - name: Assert .tool-versions written
        run: |
          cat .tool-versions || { echo "FAIL: .tool-versions missing"; exit 1; }
          if ! grep -q 'jq 1.7.1' .tool-versions; then
            echo "FAIL: .tool-versions does not contain 'jq 1.7.1'"
            exit 1
          fi
          echo "PASS"
      - name: Assert jq installed
        run: |
          out="$(mise x jq -- jq --version)"
          echo "jq version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
