name: Test tool install via tool_versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: 2026.3.10
          cache: "false"
          # Override the repo's own mise.toml so only .tool-versions drives tools
          mise_toml: |
            [tools]
          tool_versions: |
            jq 1.7.1
      - name: Assert .tool-versions written
        run: |
          cat .tool-versions || { echo "FAIL: .tool-versions missing"; exit 1; }
          grep -q '^jq 1.7.1' .tool-versions || { echo "FAIL: content missing"; exit 1; }
          echo "PASS"
      - name: Assert jq installed
        run: |
          V="$(jq --version)"
          echo "jq --version: $V"
          if [ "$V" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert versions output
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $VERSIONS"
          if ! echo "$VERSIONS" | grep -q '1.7.1'; then
            echo "FAIL: versions output missing jq 1.7.1"
            exit 1
          fi
          echo "PASS"
