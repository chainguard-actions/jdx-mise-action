name: Test tool_versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          cache: "false"
          tool_versions: |
            jq 1.7.1
      - name: Assert .tool-versions written
        run: |
          cat .tool-versions || true
          if ! grep -q 'jq 1.7.1' .tool-versions; then
            echo "FAIL: .tool-versions missing jq 1.7.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert jq installed
        run: |
          out="$(jq --version)"
          echo "jq --version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
