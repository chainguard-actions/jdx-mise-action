name: Test mise with tool_versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          tool_versions: |
            python 3.12
          install: "true"
          cache: "false"
      - name: Assert python is installed
        run: |
          echo "Checking python binary..."
          if ! command -v python3 &>/dev/null; then
            echo "FAIL: python3 not found on PATH"
            exit 1
          fi
          PY_VER=$(python3 --version)
          echo "python version: $PY_VER"
          if [[ "$PY_VER" != *"3.12"* ]]; then
            echo "FAIL: expected python 3.12.x, got $PY_VER"
            exit 1
          fi
          echo "PASS: $PY_VER is available"
      - name: Assert versions output contains python
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $VERSIONS"
          if [ -z "$VERSIONS" ]; then
            echo "FAIL: versions output is empty"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -qi "python"; then
            echo "FAIL: versions output does not contain python"
            exit 1
          fi
          echo "PASS: versions output contains python"
