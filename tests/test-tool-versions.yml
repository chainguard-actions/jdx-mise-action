name: Test mise with tool_versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool_versions: |
            node 22.0.0
          install: "false"
          cache: "false"
          fetch_from_github: "false"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert .tool-versions file was written
        run: |
          echo "Contents of .tool-versions:"
          cat .tool-versions
          if ! grep -q "node" .tool-versions; then
            echo "FAIL: .tool-versions does not contain 'node'"
            exit 1
          fi
          echo "PASS: .tool-versions contains node entry"
      - name: Assert mise version works
        run: |
          VERSION=$(mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise is functional"
