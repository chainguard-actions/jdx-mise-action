name: Test tool_versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool_versions: |
            node 20.0.0
          install: "false"
          cache: "false"
          log_level: "info"
      - name: Assert tool-versions file was written
        run: |
          if [ -f ".tool-versions" ]; then
            echo "tool-versions content:"
            cat .tool-versions
            if grep -q "node 20.0.0" .tool-versions; then
              echo "PASS: .tool-versions file contains expected content"
            else
              echo "FAIL: .tool-versions file does not contain expected content"
              exit 1
            fi
          else
            echo "FAIL: .tool-versions file was not created"
            exit 1
          fi
