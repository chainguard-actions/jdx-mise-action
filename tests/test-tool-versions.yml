name: Test mise with tool_versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          tool_versions: |
            node 20.0.0
          install: "false"
          cache: "false"
      - name: Assert .tool-versions file was written
        run: |
          if [ ! -f .tool-versions ]; then
            echo "FAIL: .tool-versions was not created"
            exit 1
          fi
          echo ".tool-versions contents:"
          cat .tool-versions
          if ! grep -q "node 20.0.0" .tool-versions; then
            echo "FAIL: .tool-versions does not contain 'node 20.0.0'"
            exit 1
          fi
          echo "PASS: .tool-versions exists and contains expected content"
      - name: Assert mise is available
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "PASS: mise is available"
