name: Test default version with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install: "false"
          cache: "false"
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert mise installed
        run: |
          command -v mise || { echo "FAIL: mise not on PATH"; exit 1; }
          mise --version
          echo "PASS"
      - name: Assert jq was not installed (install=false)
        env:
          JQ_OUT: ${{ steps.mise.outputs.jq }}
        run: |
          echo "jq output: '$JQ_OUT'"
          if [ -n "$JQ_OUT" ]; then
            echo "FAIL: jq should not be installed when install=false"
            exit 1
          fi
          echo "PASS"
