name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          add_shims_to_path: "false"
          install: "false"
      - name: Assert mise binary is still available
        run: |
          echo "Checking mise binary is available..."
          which mise || { echo "FAIL: mise binary not found on PATH"; exit 1; }
          mise --version
          echo "PASS: mise binary is available even with add_shims_to_path=false"
      - name: Assert mise shims directory is not on PATH
        run: |
          echo "Checking PATH does not contain mise shims..."
          MISE_SHIMS_DIR="${HOME}/.local/share/mise/shims"
          echo "PATH: $PATH"
          echo "Expected shims dir: $MISE_SHIMS_DIR"
          if echo "$PATH" | tr ':' '\n' | grep -qF "$MISE_SHIMS_DIR"; then
            echo "FAIL: mise shims directory is on PATH but add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory is not on PATH"
