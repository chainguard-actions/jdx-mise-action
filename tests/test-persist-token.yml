name: Test persist_github_token with explicit value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create isolated project directory
        run: mkdir -p "$RUNNER_TEMP/mise-token-proj"
      - id: mise
        uses: .
        with:
          cache: false
          install: false
          version: 2025.7.3
          sha256: d38d4993c5379a680b50661f86287731dc1d1264777880a79b786403af337948
          mise_dir: ${{ runner.temp }}/mise-token-data
          working_directory: ${{ runner.temp }}/mise-token-proj
          persist_github_token: mise-action-persist-test-token
      - name: Assert token persisted
        run: |
          if [ "${MISE_GITHUB_TOKEN:-}" != "mise-action-persist-test-token" ]; then
            echo "FAIL: MISE_GITHUB_TOKEN not set to expected value"
            exit 1
          fi
          echo "PASS"
