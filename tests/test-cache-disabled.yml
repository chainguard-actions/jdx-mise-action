name: Test mise with cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
      - name: Assert cache-hit is false when cache is disabled
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # When cache is disabled, cache-hit should be false
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: cache-hit should not be true when cache is disabled"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT' (not true, as expected)"
      - name: Assert mise is still installed and functional
        run: |
          echo "which mise: $(which mise || echo 'not found')"
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH even with cache disabled"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available without cache"
