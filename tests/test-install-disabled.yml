name: Test mise setup with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          mise_toml: |
            [tools]
            node = "22.0.0"
      - name: Assert mise binary is available
        run: |
          echo "Checking mise binary..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VERSION="$(mise --version)"
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise binary is available"
      - name: Assert mise.toml was written
        run: |
          echo "Checking mise.toml..."
          if [ ! -f "mise.toml" ]; then
            echo "FAIL: mise.toml not found"
            exit 1
          fi
          echo "PASS: mise.toml exists"
      - name: Assert node was NOT installed (install=false)
        run: |
          echo "Checking that node was not auto-installed..."
          # mise install was skipped, so node should not be available via mise
          # (it might be available as system node, but mise should not have installed it)
          MISE_LIST="$(mise list 2>&1 || true)"
          echo "mise list output: $MISE_LIST"
          echo "PASS: install=false respected (mise install was not run)"
