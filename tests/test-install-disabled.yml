name: Test mise with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          env: "false"
          mise_toml: |
            [tools]
            node = "22"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert node is NOT installed (install was skipped)
        run: |
          # When install=false, mise install is not run, so node should not be installed
          NODE_PATH=$(mise which node 2>/dev/null || echo "")
          echo "node path: $NODE_PATH"
          if [ -n "$NODE_PATH" ]; then
            echo "FAIL: node should not be installed when install=false, but found: $NODE_PATH"
            exit 1
          fi
          echo "PASS: node is not installed as expected when install=false"
