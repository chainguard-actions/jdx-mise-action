name: Test version and sha256 inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.5"
          sha256: "e3e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4"
          install: "false"
          cache: "false"
          log_level: "info"
        continue-on-error: true
      - name: Assert step ran
        run: |
          echo "PASS: version and sha256 inputs were accepted"
