name: Test version and sha256 inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.5.16"
          sha256: ""
          cache: "false"
          install: "false"
      - name: Assert mise is available
        run: |
          which mise || (echo "FAIL: mise not found in PATH" && exit 1)
          MISE_VERSION=$(mise --version 2>&1 | head -1)
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise is available"
