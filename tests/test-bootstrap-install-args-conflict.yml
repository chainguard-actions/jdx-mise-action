name: Test bootstrap rejects install_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        continue-on-error: true
        with:
          version: 2025.1.0
          cache: "false"
          bootstrap: "true"
          bootstrap_skip: "tools,task"
          bootstrap_args: "--verbose"
          install_args: jq
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert action failed due to install_args with bootstrap
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because install_args cannot be combined with bootstrap"
            exit 1
          fi
          echo "PASS"
      - name: Assert mise binary was still set up before the error
        run: |
          VER="$(mise --version 2>/dev/null || "$HOME/.local/share/mise/bin/mise" --version)"
          echo "mise --version: $VER"
          echo "$VER" | grep -q '2025.1.0' || { echo "FAIL: expected mise 2025.1.0"; exit 1; }
          echo "PASS"
