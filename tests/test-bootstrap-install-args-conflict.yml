name: Test bootstrap rejects install_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working dir
        run: mkdir -p "$GITHUB_WORKSPACE/mise-bootstrap-test"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: mise-bootstrap-test
          cache: "false"
          bootstrap: "true"
          bootstrap_skip: "tools,task"
          bootstrap_args: "--verbose"
          install_args: jq
      - name: Assert action failed due to install_args with bootstrap
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when install_args is used with bootstrap"
            exit 1
          fi
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise should still have been installed before the bootstrap check"
            exit 1
          fi
          echo "PASS"
