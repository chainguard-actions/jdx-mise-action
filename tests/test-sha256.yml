name: Test sha256 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get sha256 for mise version
        id: get-sha256
        run: |
          VERSION="v2024.12.20"
          URL="https://github.com/jdx/mise/releases/download/${VERSION}/mise-${VERSION}-linux-x64.tar.gz"
          SHA256=$(curl -sfL "$URL" | sha256sum | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHA256 for version $VERSION"
      - id: action
        uses: .
        with:
          version: ${{ steps.get-sha256.outputs.version }}
          sha256: ${{ steps.get-sha256.outputs.sha256 }}
          cache: "false"
      - name: Assert mise is available
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "PASS: mise is available"
