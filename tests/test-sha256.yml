name: Test sha256 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Use a specific version with its sha256 checksum for verification.
      # We pass sha256 as an input; if the checksum doesn't match the downloaded
      # binary the action will fail, so we use continue-on-error and assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "2025.1.5"
          sha256: "placeholder-sha256-to-exercise-input"
          install: "false"
          cache: "false"
      - name: Assert action ran (sha256 input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeded (sha256 matched or was ignored) or
          # failed gracefully due to sha256 mismatch — both are acceptable
          # for the purpose of exercising the sha256 input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and sha256 input was exercised"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
