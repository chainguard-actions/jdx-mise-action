name: Test sha256 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get mise binary sha256 for a specific version
        id: get-sha256
        run: |
          VERSION="2025.5.16"
          ARCH="x86_64"
          URL="https://github.com/jdx/mise/releases/download/v${VERSION}/mise-v${VERSION}-linux-${ARCH}"
          echo "Downloading mise v${VERSION} to compute sha256..."
          curl -sfL "$URL" -o /tmp/mise-binary
          SHA256=$(sha256sum /tmp/mise-binary | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHA256"
      - id: action
        uses: .
        with:
          version: ${{ steps.get-sha256.outputs.version }}
          sha256: ${{ steps.get-sha256.outputs.sha256 }}
          cache: "false"
      - name: Assert mise is available
        run: |
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available"
          mise --version
