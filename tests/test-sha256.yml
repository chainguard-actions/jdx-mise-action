name: Test sha256 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get mise version and sha256
        id: get-sha
        run: |
          # Use a known stable version and its sha256 for linux x86_64
          VERSION="v2025.1.5"
          URL="https://github.com/jdx/mise/releases/download/${VERSION}/mise-${VERSION}-linux-x64"
          SHA=$(curl -sfL "${URL}.sha256" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Fetched sha256: ${SHA} for version ${VERSION}"
      - id: mise
        uses: .
        with:
          version: "${{ steps.get-sha.outputs.version }}"
          sha256: "${{ steps.get-sha.outputs.sha256 }}"
          cache: "false"
          install: "false"
      - name: Assert mise is available
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "PASS: mise is available with sha256 verification"
