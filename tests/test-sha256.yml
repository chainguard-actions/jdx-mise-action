name: Test sha256 checksum verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.5"
          sha256: "e4b9f5e5a3e4e5b5e5a3e4e5b5e5a3e4e5b5e5a3e4e5b5e5a3e4e5b5e5a3e4e5"
          cache: "false"
        continue-on-error: true
      - name: Assert action ran (sha256 mismatch causes failure, which is expected behavior)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid sha256 (checksum mismatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (sha256 matched)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
