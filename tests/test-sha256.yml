name: Test sha256 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get mise sha256 for a specific version
        id: get-sha256
        run: |
          # Fetch the sha256 for mise v2025.1.5 linux x64
          SHA256=$(curl -sfL "https://github.com/jdx/mise/releases/download/v2025.1.5/SHASUMS256.txt" \
            | grep "mise-v2025.1.5-linux-x64$" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Fetched sha256: $SHA256"
      - id: mise
        uses: .
        with:
          version: "v2025.1.5"
          sha256: ${{ steps.get-sha256.outputs.sha256 }}
          install: "false"
          cache: "false"
      - name: Assert mise is available
        run: |
          echo "Checking mise is on PATH"
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available with sha256 verification"
