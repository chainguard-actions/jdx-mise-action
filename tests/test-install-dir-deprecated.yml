name: Test deprecated install_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project subdirectory with .tool-versions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/legacy-project"
          echo "jq 1.7.1" > "$GITHUB_WORKSPACE/legacy-project/.tool-versions"
      - id: mise
        uses: .
        with:
          cache: "false"
          install_dir: legacy-project
      - name: Assert jq from install_dir config installed
        working-directory: legacy-project
        run: |
          out="$(jq --version)"
          echo "jq --version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
