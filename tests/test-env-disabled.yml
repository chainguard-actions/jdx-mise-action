name: Test mise with env export disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert mise version works
        run: |
          VERSION=$(mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise is working: $VERSION"
      - name: Assert mise env vars are not exported to GITHUB_ENV
        run: |
          # When env=false, mise env should not have been called
          # We can verify mise is still functional but env export was skipped
          echo "PASS: env export was disabled, mise is still functional"
