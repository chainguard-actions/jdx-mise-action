name: Test mise with add_shims_to_path disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          env: "false"
          add_shims_to_path: "false"
      - name: Assert mise binary is on PATH (bin dir still added)
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert shims dir is NOT on PATH
        run: |
          SHIMS_DIR="$HOME/.local/share/mise/shims"
          echo "PATH: $PATH"
          if echo "$PATH" | grep -q "$SHIMS_DIR"; then
            echo "FAIL: shims directory should NOT be in PATH when add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: shims directory is not in PATH as expected"
