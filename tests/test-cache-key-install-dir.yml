name: Test cache_key and install_dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_dir: "/tmp/mise-install-dir"
          cache_key: "my-custom-cache-key-{{version}}"
          install: "false"
          cache: "false"
          log_level: "info"
      - name: Assert step ran with cache_key and install_dir
        run: |
          echo "PASS: cache_key and install_dir inputs were accepted"
