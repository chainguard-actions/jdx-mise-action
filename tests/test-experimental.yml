name: Test mise with experimental flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          experimental: "true"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert MISE_EXPERIMENTAL env var is set
        run: |
          echo "MISE_EXPERIMENTAL: $MISE_EXPERIMENTAL"
          if [ "$MISE_EXPERIMENTAL" != "1" ]; then
            echo "FAIL: expected MISE_EXPERIMENTAL=1, got: $MISE_EXPERIMENTAL"
            exit 1
          fi
          echo "PASS: MISE_EXPERIMENTAL=1 as expected"
