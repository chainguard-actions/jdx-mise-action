name: Test mise with experimental features enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          experimental: "true"
          fetch_from_github: "false"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert MISE_EXPERIMENTAL env var is set
        run: |
          echo "MISE_EXPERIMENTAL: $MISE_EXPERIMENTAL"
          if [ "$MISE_EXPERIMENTAL" != "1" ]; then
            echo "FAIL: MISE_EXPERIMENTAL should be '1' but got: $MISE_EXPERIMENTAL"
            exit 1
          fi
          echo "PASS: MISE_EXPERIMENTAL is set to 1"
      - name: Assert mise version works with experimental enabled
        run: |
          VERSION=$(mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise is functional with experimental enabled"
