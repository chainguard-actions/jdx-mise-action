name: Test env vars exported from mise_toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: 2025.1.0
          cache: "false"
          mise_toml: |
            [env]
            MY_TEST_VAR = "hello-from-mise"
      - name: Assert mise.toml was written
        run: |
          cat mise.toml
          grep -q 'MY_TEST_VAR' mise.toml || { echo "FAIL: mise.toml not written"; exit 1; }
          echo "PASS"
      - name: Assert env var exported to later steps
        run: |
          echo "MY_TEST_VAR=$MY_TEST_VAR"
          if [ "$MY_TEST_VAR" != "hello-from-mise" ]; then
            echo "FAIL: expected 'hello-from-mise'"
            exit 1
          fi
          echo "PASS"
