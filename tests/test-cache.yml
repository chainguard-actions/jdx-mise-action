name: Test mise cache behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "true"
          cache_key_prefix: "test-mise-cache-prefix"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either true or false (a boolean string)
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit to be 'true' or 'false', got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit output is set to '$CACHE_HIT'"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
