name: Test mise with deprecated install_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install_dir: "/tmp/mise-install-dir"
          install: "false"
          cache: "false"
        continue-on-error: true
      - name: Assert mise binary is available
        run: |
          echo "Checking mise is in PATH..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          MISE_VERSION=$(mise --version)
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise binary is available (install_dir is deprecated but accepted)"
