name: Test install_dir input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_dir: "/tmp/mise-install-dir"
          install: "false"
          cache: "false"
        continue-on-error: true
      - name: Assert action ran (install_dir is deprecated but should not crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v mise >/dev/null 2>&1; then
              echo "FAIL: action succeeded but mise not found"
              exit 1
            fi
            echo "PASS: action succeeded with install_dir input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (install_dir is deprecated)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
