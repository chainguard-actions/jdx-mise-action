name: Test mise with deprecated install_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_dir: "/tmp/deprecated-install-dir"
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          echo "mise path: $(which mise || echo 'not found')"
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH (install_dir input accepted)"
      - name: Assert mise version runs
        run: |
          VERSION=$(mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise functional with deprecated install_dir input"
