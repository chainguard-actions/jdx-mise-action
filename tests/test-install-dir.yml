name: Test install_dir input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install_dir: "/tmp/mise-install-dir-test"
          install: "false"
          cache: "false"
        continue-on-error: true
      - name: Assert action ran with install_dir input
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # install_dir is deprecated; action may succeed or warn/fail
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with install_dir set"
            if ! command -v mise &>/dev/null; then
              echo "FAIL: mise not found in PATH after install"
              exit 1
            fi
            echo "PASS: mise is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (deprecated install_dir may not be supported)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
