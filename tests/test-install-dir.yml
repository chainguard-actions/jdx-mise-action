name: Test install_dir input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install_dir: "/tmp/mise-install-dir"
          install: "false"
          cache: "false"
        continue-on-error: true
      - name: Assert action ran (install_dir is deprecated but accepted)
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # install_dir is deprecated; the action may succeed or warn/fail
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with install_dir input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert mise is available on success
        if: steps.mise.outcome == 'success'
        run: |
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available"
