name: Test mise_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          mise_dir: "/tmp/mise-custom-dir"
          install: "false"
          cache: "false"
      - name: Assert mise is available
        run: |
          echo "Checking mise is on PATH"
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available"
      - name: Assert MISE_DATA_DIR is set to custom dir
        env:
          MISE_DATA_DIR: ${{ env.MISE_DATA_DIR }}
        run: |
          echo "MISE_DATA_DIR: $MISE_DATA_DIR"
          if [ "$MISE_DATA_DIR" != "/tmp/mise-custom-dir" ]; then
            echo "FAIL: expected MISE_DATA_DIR to be '/tmp/mise-custom-dir', got '$MISE_DATA_DIR'"
            exit 1
          fi
          echo "PASS: MISE_DATA_DIR is set correctly"
