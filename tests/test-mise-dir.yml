name: Test mise_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_dir: /tmp/mise-custom-dir
          install: "false"
          cache: "false"
      - name: Assert mise installed in custom directory
        run: |
          echo "Checking mise binary in custom dir..."
          if [ ! -f "/tmp/mise-custom-dir/bin/mise" ]; then
            echo "FAIL: mise binary not found in /tmp/mise-custom-dir/bin/mise"
            exit 1
          fi
          echo "PASS: mise binary found in custom directory"
