name: Test mise_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_dir: "/tmp/mise-custom-dir"
          install: "false"
          cache: "false"
          log_level: "info"
      - name: Assert mise is available
        run: |
          which mise || (echo "FAIL: mise not found in PATH" && exit 1)
          echo "PASS: mise is available with custom mise_dir"
