name: Test custom mise_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "false"
          mise_dir: ${{ runner.temp }}/custom-mise
          tool_versions: |
            jq 1.7.1
      - name: Assert MISE_DATA_DIR exported and binary placed in mise_dir
        env:
          EXPECTED: ${{ runner.temp }}/custom-mise
        run: |
          echo "MISE_DATA_DIR: $MISE_DATA_DIR"
          if [ "$MISE_DATA_DIR" != "$EXPECTED" ]; then
            echo "FAIL: expected MISE_DATA_DIR=$EXPECTED"
            exit 1
          fi
          if [ ! -x "$EXPECTED/bin/mise" ]; then
            echo "FAIL: mise binary not found at $EXPECTED/bin/mise"
            ls -la "$EXPECTED" || true
            exit 1
          fi
          if [ ! -d "$EXPECTED/installs/jq" ]; then
            echo "FAIL: jq not installed under $EXPECTED/installs"
            ls -la "$EXPECTED/installs" || true
            exit 1
          fi
          echo "PASS"
      - name: Assert mise on PATH comes from mise_dir
        env:
          EXPECTED: ${{ runner.temp }}/custom-mise
        run: |
          WHICH="$(command -v mise)"
          echo "mise path: $WHICH"
          case "$WHICH" in
            "$EXPECTED"/*) echo "PASS" ;;
            *) echo "FAIL: mise not from $EXPECTED"; exit 1 ;;
          esac
