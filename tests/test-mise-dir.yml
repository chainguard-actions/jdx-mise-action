name: Test mise installation with custom mise_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_dir: "/tmp/custom-mise-dir"
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise binary exists in custom mise_dir
        run: |
          echo "Checking for mise binary in /tmp/custom-mise-dir"
          ls -la /tmp/custom-mise-dir/ || true
          if [ ! -f "/tmp/custom-mise-dir/bin/mise" ]; then
            echo "FAIL: mise binary not found in custom mise_dir /tmp/custom-mise-dir/bin/mise"
            exit 1
          fi
          echo "PASS: mise binary found in custom mise_dir"
      - name: Assert mise is functional
        run: |
          VERSION=$(/tmp/custom-mise-dir/bin/mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise is functional in custom mise_dir"
