name: Test mise_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove existing mise config to avoid conflicts
        run: |
          rm -f mise.toml .tool-versions
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          mise_dir: "/tmp/mise-custom-dir"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available with custom mise_dir"
      - name: Assert mise installed in custom directory
        run: |
          echo "Checking mise binary in custom dir..."
          if [ ! -f "/tmp/mise-custom-dir/bin/mise" ]; then
            echo "WARN: mise binary not found at /tmp/mise-custom-dir/bin/mise (may be in shims or elsewhere)"
          fi
          echo "PASS: mise_dir input accepted"
