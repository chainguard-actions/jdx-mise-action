name: Test mise_dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          mise_dir: "/tmp/mise-custom-dir"
          cache: "false"
      - name: Assert mise is available
        run: |
          echo "cache-hit: ${{ steps.mise.outputs.cache-hit }}"
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "PASS: mise is available"
      - name: Assert mise_dir was used
        run: |
          if [ ! -d "/tmp/mise-custom-dir" ]; then
            echo "FAIL: custom mise_dir /tmp/mise-custom-dir does not exist"
            exit 1
          fi
          echo "PASS: custom mise_dir exists"
