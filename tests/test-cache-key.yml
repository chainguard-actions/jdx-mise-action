name: Test custom cache_key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "true"
          cache_save: "false"
          install: "false"
          cache_key: "mise-act-test-{{env.GITHUB_RUN_ID}}-{{platform}}-unique-nohit"
      - name: Assert cache miss for a unique custom key
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit 'false' for a never-saved custom key"
            exit 1
          fi
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          mise --version
          echo "PASS"
