name: Test custom cache_key template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: mise
        uses: .
        with:
          cache: true
          cache_save: false
          cache_key: "act-test-{{cache_key_prefix}}-{{platform}}-{{env.GITHUB_RUN_ID}}-{{env.RANDOM_NONEXISTENT}}"
          tool_versions: |
            jq 1.7.1
      - name: Assert mise works and cache missed for unique key
        env:
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "FAIL: unexpected cache hit for a never-saved key"
            exit 1
          fi
          out="$(mise x jq -- jq --version)"
          echo "jq version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
