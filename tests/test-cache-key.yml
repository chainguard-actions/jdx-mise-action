name: Test cache_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          cache_key: "mise-test-custom-key-v1"
          cache: "true"
      - name: Assert mise is available
        run: |
          echo "mise version: $(mise --version)"
          if ! mise --version; then
            echo "FAIL: mise is not available"
            exit 1
          fi
          echo "PASS"
