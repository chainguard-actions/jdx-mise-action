name: Test cache_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache_key: "my-custom-cache-key-v1"
          install: "false"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either true or false (not empty) when cache_key is provided
          if [ -z "$CACHE_HIT" ]; then
            echo "WARN: cache-hit output is empty (may be expected on first run)"
          fi
          echo "PASS: action completed with custom cache_key"
      - name: Assert mise is available
        run: |
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found"
            exit 1
          fi
          echo "PASS: mise is available"
