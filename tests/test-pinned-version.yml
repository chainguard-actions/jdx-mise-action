name: Test mise with pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: "2025.5.16"
          install: "false"
          cache: "false"
      - name: Assert mise version matches pinned version
        run: |
          echo "Checking mise version..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VER=$(mise --version)
          echo "mise version output: $MISE_VER"
          if [[ "$MISE_VER" != *"2025.5.16"* ]]; then
            echo "FAIL: expected mise 2025.5.16, got $MISE_VER"
            exit 1
          fi
          echo "PASS: mise $MISE_VER matches pinned version"
