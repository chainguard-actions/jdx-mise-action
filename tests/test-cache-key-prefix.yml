name: Test mise with custom cache key prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          cache_key_prefix: "my-custom-prefix-v1"
          install: "false"
      - name: Assert mise is available with custom cache prefix
        run: |
          echo "Checking mise is in PATH..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise installed successfully with custom cache key prefix"
