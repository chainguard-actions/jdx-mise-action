name: Test mise with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.5.16"
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert correct version is installed
        run: |
          VERSION=$(mise --version)
          echo "mise version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          # Version string should contain 2025.5.16
          if ! echo "$VERSION" | grep -q "2025.5.16"; then
            echo "FAIL: expected version 2025.5.16, got: $VERSION"
            exit 1
          fi
          echo "PASS: correct mise version installed: $VERSION"
