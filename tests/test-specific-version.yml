name: Test mise with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.0"
          install: "false"
          cache: "false"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert correct mise version is installed
        run: |
          VERSION=$(mise --version 2>&1 || true)
          echo "mise version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty output"
            exit 1
          fi
          # Check that the version contains 2025.1.0
          if ! echo "$VERSION" | grep -q "2025.1.0"; then
            echo "FAIL: expected version 2025.1.0, got: $VERSION"
            exit 1
          fi
          echo "PASS: correct mise version installed: $VERSION"
