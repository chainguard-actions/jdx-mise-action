name: Test mise installation with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.5"
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert correct version installed
        run: |
          INSTALLED=$(mise --version)
          echo "installed version output: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "2025.1.5"; then
            echo "FAIL: expected version 2025.1.5 but got: $INSTALLED"
            exit 1
          fi
          echo "PASS: correct version installed"
      - name: Assert cache-hit is false when cache disabled
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit=false when cache is disabled, got: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit=false as expected"
