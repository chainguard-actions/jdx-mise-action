name: Test specific mise version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.5"
          install: "false"
          cache: "false"
          env: "false"
      - name: Assert mise is available in PATH
        run: |
          echo "which mise: $(which mise)"
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "PASS: mise is available"
      - name: Assert correct mise version is installed
        run: |
          VERSION=$(mise --version)
          echo "mise version output: $VERSION"
          if ! echo "$VERSION" | grep -q "2025.1.5"; then
            echo "FAIL: expected version 2025.1.5, got: $VERSION"
            exit 1
          fi
          echo "PASS: correct version installed"
