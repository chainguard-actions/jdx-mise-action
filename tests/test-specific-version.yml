name: Test mise with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: "2025.1.0"
          install: "false"
          cache: "false"
      - name: Assert mise version matches requested
        run: |
          echo "Checking mise version..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VERSION="$(mise --version)"
          echo "mise version: $MISE_VERSION"
          if ! echo "$MISE_VERSION" | grep -q "2025.1.0"; then
            echo "FAIL: expected mise 2025.1.0, got $MISE_VERSION"
            exit 1
          fi
          echo "PASS: mise version is $MISE_VERSION"
