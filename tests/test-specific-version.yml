name: Test mise with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: "2025.1.5"
          install: "false"
          cache: "false"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VER=$(mise --version)
          echo "mise version: $MISE_VER"
          echo "PASS: mise is available"
      - name: Assert mise version matches requested
        run: |
          MISE_VER=$(mise --version)
          echo "mise version output: $MISE_VER"
          if ! echo "$MISE_VER" | grep -q "2025.1.5"; then
            echo "FAIL: expected mise version 2025.1.5, got: $MISE_VER"
            exit 1
          fi
          echo "PASS: mise version is 2025.1.5"
