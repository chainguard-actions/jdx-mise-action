name: Test specific mise version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2025.1.5"
          install: "false"
          cache: "false"
      - name: Assert correct mise version is installed
        run: |
          INSTALLED_VERSION="$(mise --version 2>&1 | head -1)"
          echo "installed version: $INSTALLED_VERSION"
          if ! echo "$INSTALLED_VERSION" | grep -q "2025.1.5"; then
            echo "FAIL: expected version 2025.1.5 but got: $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: correct mise version installed"
