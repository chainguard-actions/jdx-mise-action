name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove existing mise config to avoid conflicts
        run: |
          rm -f mise.toml .tool-versions
      - name: Create a working directory with a mise.toml
        run: |
          mkdir -p /tmp/mise-workdir
          cat > /tmp/mise-workdir/mise.toml <<'EOF'
          [tools]
          EOF
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          working_directory: "/tmp/mise-workdir"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available with working_directory set"
