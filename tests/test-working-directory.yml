name: Test mise with working_directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/mise-workdir
      - id: mise
        uses: .
        with:
          working_directory: "/tmp/mise-workdir"
          install: "false"
          cache: "false"
      - name: Assert mise binary is available
        run: |
          echo "Checking mise is in PATH..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          MISE_VERSION=$(mise --version)
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise binary is available with working_directory set"
