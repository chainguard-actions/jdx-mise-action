name: Test mise with working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory with a mise config
        run: |
          mkdir -p /tmp/mise-workdir
          cat > /tmp/mise-workdir/mise.toml << 'EOF'
          [tools]
          node = "20.0.0"
          EOF
          echo "Created mise.toml in /tmp/mise-workdir"
          cat /tmp/mise-workdir/mise.toml
      - id: mise
        uses: .
        with:
          working_directory: /tmp/mise-workdir
          cache: "false"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available"
      - name: Assert node is installed from working directory config
        run: |
          echo "Checking node is available..."
          if ! command -v node >/dev/null 2>&1; then
            echo "FAIL: node not found on PATH"
            exit 1
          fi
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v20* ]]; then
            echo "FAIL: expected node v20.x, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node $NODE_VERSION is available"
