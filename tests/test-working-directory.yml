name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project subdirectory with .tool-versions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wd-project"
          echo "jq 1.7.1" > "$GITHUB_WORKSPACE/wd-project/.tool-versions"
      - id: mise
        uses: .
        with:
          cache: "false"
          working_directory: wd-project
      - name: Assert jq from subdirectory config installed
        working-directory: wd-project
        run: |
          out="$(jq --version)"
          echo "jq --version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
      - name: Assert versions output mentions jq
        env:
          ACTUAL: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q 'jq'; then
            echo "FAIL: versions output does not mention jq"
            exit 1
          fi
          echo "PASS"
