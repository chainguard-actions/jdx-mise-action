name: Test mise with working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with mise config
        run: |
          mkdir -p /tmp/mise-test-workdir
          cat > /tmp/mise-test-workdir/mise.toml << 'EOF'
          [tools]
          usage = "latest"
          EOF
      - id: action
        uses: .
        with:
          working_directory: "/tmp/mise-test-workdir"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert usage was installed from working directory config
        run: |
          cd /tmp/mise-test-workdir
          USAGE_PATH=$(mise which usage 2>/dev/null || echo "")
          echo "usage path: $USAGE_PATH"
          if [ -z "$USAGE_PATH" ]; then
            echo "FAIL: usage not installed after mise install in working_directory"
            exit 1
          fi
          echo "PASS: usage installed at: $USAGE_PATH"
