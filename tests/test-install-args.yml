name: Test install_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tool_versions: |
            node 22.0.0
          install_args: "node"
          install: "true"
      - name: Assert mise is installed
        run: |
          echo "Checking mise binary..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VERSION="$(mise --version)"
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise is available"
      - name: Assert node was installed via install_args
        run: |
          echo "Checking node availability..."
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found on PATH after mise install node"
            exit 1
          fi
          NODE_VERSION="$(node --version)"
          echo "node version: $NODE_VERSION"
          echo "PASS: node is available after install_args=node"
