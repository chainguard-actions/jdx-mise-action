name: Test install_args and working_directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/mise-workdir
      - id: action
        uses: .
        with:
          install_args: "--help"
          working_directory: /tmp/mise-workdir
          cache: "false"
      - name: Assert mise is available
        run: |
          echo "Checking mise is on PATH..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available"
