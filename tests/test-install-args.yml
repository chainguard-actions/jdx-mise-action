name: Test mise with install_args to install specific tool
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            usage = "latest"
          install_args: "usage"
          cache: "false"
          env: "false"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert usage was installed
        run: |
          USAGE_PATH=$(mise which usage 2>/dev/null || echo "")
          echo "usage path: $USAGE_PATH"
          if [ -z "$USAGE_PATH" ]; then
            echo "FAIL: usage not installed after mise install usage"
            exit 1
          fi
          echo "PASS: usage installed at: $USAGE_PATH"
