name: Test install_args restricts installed tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove repo mise config so only the mise_toml input applies
        run: rm -rf "$GITHUB_WORKSPACE/mise.lock" "$GITHUB_WORKSPACE/.mise.toml" "$GITHUB_WORKSPACE/.mise"
      - id: mise
        uses: .
        with:
          cache: false
          version: 2025.7.3
          sha256: d38d4993c5379a680b50661f86287731dc1d1264777880a79b786403af337948
          mise_dir: ${{ runner.temp }}/mise-installargs-data
          mise_toml: |
            [tools]
            jq = "1.7.1"
            yq = "4.44.3"
          install_args: jq
      - name: Assert only jq was installed
        run: |
          echo "MISE_DATA_DIR: $MISE_DATA_DIR"
          ls -la "$MISE_DATA_DIR/installs" || true
          if [ ! -d "$MISE_DATA_DIR/installs/jq/1.7.1" ]; then
            echo "FAIL: jq 1.7.1 was not installed"
            exit 1
          fi
          if [ -d "$MISE_DATA_DIR/installs/yq/4.44.3" ]; then
            echo "FAIL: yq should not be installed when install_args=jq"
            exit 1
          fi
          echo "PASS"
