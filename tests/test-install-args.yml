name: Test install_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write mise.toml with node
        run: |
          cat > mise.toml <<'EOF'
          [tools]
          node = "lts"
          EOF
      - id: action
        uses: .
        with:
          install_args: "node"
          cache: "false"
      - name: Assert node is available
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "FAIL: node not found after install_args=node"
            exit 1
          fi
          echo "PASS: node is available"
