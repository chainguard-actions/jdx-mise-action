name: Test install_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          cache: "false"
          install_args: jq
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert jq installed via install_args
        run: |
          out="$(jq --version)"
          echo "jq --version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
