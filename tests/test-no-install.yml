name: Test mise with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
      - name: Assert mise is available on PATH even without install
        run: |
          echo "Checking mise is on PATH..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert mise version is valid
        run: |
          echo "Running mise --version..."
          VERSION=$(mise --version 2>&1)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty output"
            exit 1
          fi
          echo "PASS: mise version is '$VERSION'"
      - name: Assert cache-hit output reflects disabled cache
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" = "false" ]; then
            echo "PASS: cache-hit is 'false' as expected when cache is disabled"
          elif [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit is empty (acceptable when cache is disabled)"
          else
            echo "INFO: cache-hit is '$CACHE_HIT'"
            echo "PASS"
          fi
