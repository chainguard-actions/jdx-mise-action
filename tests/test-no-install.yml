name: Test mise with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available even with install=false"
      - name: Assert mise version command works
        run: |
          VERSION=$(mise --version)
          echo "mise version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty string"
            exit 1
          fi
          echo "PASS: mise --version returned '$VERSION'"
