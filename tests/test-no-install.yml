name: Test mise with install disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean working directory
        run: mkdir -p /tmp/mise-test-no-install
      - id: mise
        uses: .
        with:
          install: "false"
          cache: "false"
          working_directory: /tmp/mise-test-no-install
      - name: Assert mise is on PATH even when install is false
        run: |
          echo "Checking mise is available..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available with install=false"
      - name: Assert versions output is valid JSON
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $VERSIONS"
          # With no tools installed, versions should be an empty JSON object {}
          if [ -z "$VERSIONS" ]; then
            echo "FAIL: versions output is empty string (expected at least '{}')"
            exit 1
          fi
          if ! echo "$VERSIONS" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: versions output is not valid JSON"
            exit 1
          fi
          echo "PASS: versions output is valid JSON"
