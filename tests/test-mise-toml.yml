name: Test mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "20"
          cache: "false"
          install: "true"
      - name: Assert node is available via mise
        run: |
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found in PATH"
            exit 1
          fi
          echo "PASS: node is available"
          node --version
