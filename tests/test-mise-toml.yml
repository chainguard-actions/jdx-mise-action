name: Test mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "20"
          cache: "false"
          log_level: "info"
      - name: Assert node is available
        run: |
          which node || (echo "FAIL: node not found in PATH" && exit 1)
          NODE_VERSION=$(node --version 2>&1)
          echo "node version: $NODE_VERSION"
          echo "PASS: node is available via mise_toml"
