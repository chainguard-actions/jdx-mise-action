name: Test mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "20"
          install: "false"
          cache: "false"
          log_level: "info"
      - name: Assert mise.toml file was written
        run: |
          if [ -f "mise.toml" ]; then
            echo "mise.toml content:"
            cat mise.toml
            if grep -q "node" mise.toml; then
              echo "PASS: mise.toml file contains expected content"
            else
              echo "FAIL: mise.toml file does not contain expected content"
              exit 1
            fi
          else
            echo "FAIL: mise.toml file was not created"
            exit 1
          fi
