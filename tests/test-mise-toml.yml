name: Test mise with mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "20.0.0"
          cache: "false"
      - name: Assert node is installed via mise.toml
        run: |
          echo "Checking node is available..."
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found in PATH"
            exit 1
          fi
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v20* ]]; then
            echo "FAIL: expected node v20.x, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node $NODE_VERSION is available"
      - name: Assert mise.toml was written
        run: |
          if [ ! -f mise.toml ]; then
            echo "FAIL: mise.toml was not created"
            exit 1
          fi
          echo "mise.toml contents:"
          cat mise.toml
          echo "PASS: mise.toml exists"
