name: Test mise with mise.toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "22.0.0"
          cache: "false"
          install: "true"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert mise.toml file was written
        run: |
          if [ ! -f "mise.toml" ]; then
            echo "FAIL: mise.toml file not found"
            exit 1
          fi
          echo "Contents of mise.toml:"
          cat mise.toml
          if ! grep -q "node" mise.toml; then
            echo "FAIL: mise.toml does not contain 'node'"
            exit 1
          fi
          echo "PASS: mise.toml file exists and contains node"
      - name: Assert node is installed via mise
        run: |
          NODE_VERSION=$(mise exec -- node --version 2>&1 || true)
          echo "node version via mise: $NODE_VERSION"
          if [ -z "$NODE_VERSION" ]; then
            echo "FAIL: node not installed via mise"
            exit 1
          fi
          echo "PASS: node is available via mise: $NODE_VERSION"
