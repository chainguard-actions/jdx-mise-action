name: Test mise with mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: "false"
          env: "false"
          mise_toml: |
            [tools]
            node = "22"
      - name: Assert mise is on PATH
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert mise.toml was written
        run: |
          if [ ! -f mise.toml ]; then
            echo "FAIL: mise.toml was not created"
            exit 1
          fi
          echo "mise.toml contents:"
          cat mise.toml
          if ! grep -q "node" mise.toml; then
            echo "FAIL: mise.toml does not contain 'node'"
            exit 1
          fi
          echo "PASS: mise.toml was created with correct content"
      - name: Assert node is available via mise
        run: |
          NODE_VERSION=$(mise exec -- node --version 2>/dev/null || echo "")
          echo "node version: $NODE_VERSION"
          if [ -z "$NODE_VERSION" ]; then
            echo "FAIL: node not available via mise"
            exit 1
          fi
          echo "PASS: node is available: $NODE_VERSION"
