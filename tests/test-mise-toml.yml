name: Test mise with mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            usage = "latest"
          cache: "false"
          env: "false"
      - name: Assert mise.toml file was written
        run: |
          if [ ! -f "mise.toml" ]; then
            echo "FAIL: mise.toml file not found"
            exit 1
          fi
          echo "PASS: mise.toml file exists"
          cat mise.toml
      - name: Assert mise.toml content
        run: |
          CONTENT=$(cat mise.toml)
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "usage"; then
            echo "FAIL: mise.toml does not contain 'usage'"
            exit 1
          fi
          echo "PASS: mise.toml contains expected content"
      - name: Assert usage is installed via mise
        run: |
          USAGE_PATH=$(mise which usage 2>/dev/null || echo "")
          echo "usage path: $USAGE_PATH"
          if [ -z "$USAGE_PATH" ]; then
            echo "FAIL: usage not installed via mise"
            exit 1
          fi
          echo "PASS: usage installed at: $USAGE_PATH"
