name: Test mise with mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "22.0.0"
          install: "true"
          cache: "false"
      - name: Assert node 22 is installed
        run: |
          echo "Checking node binary..."
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found on PATH"
            exit 1
          fi
          NODE_VERSION="$(node --version)"
          echo "node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v22* ]]; then
            echo "FAIL: expected node v22.x, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node $NODE_VERSION is available"
      - name: Assert versions output contains node
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $VERSIONS"
          if [ -z "$VERSIONS" ]; then
            echo "FAIL: versions output is empty"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -q "node"; then
            echo "FAIL: versions output does not contain 'node'"
            exit 1
          fi
          echo "PASS: versions output contains node"
