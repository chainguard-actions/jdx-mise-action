name: Test mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "22.0.0"
          install: "true"
      - name: Assert mise.toml file was written
        run: |
          echo "Checking mise.toml file..."
          if [ ! -f "mise.toml" ]; then
            echo "FAIL: mise.toml file not found"
            exit 1
          fi
          CONTENT="$(cat mise.toml)"
          echo "Contents: $CONTENT"
          if echo "$CONTENT" | grep -q "node"; then
            echo "PASS: mise.toml contains node entry"
          else
            echo "FAIL: mise.toml does not contain expected node entry"
            exit 1
          fi
      - name: Assert node is available via mise
        run: |
          echo "Checking node availability..."
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found on PATH after mise install"
            exit 1
          fi
          NODE_VERSION="$(node --version)"
          echo "node version: $NODE_VERSION"
          echo "PASS: node is available"
