name: Test mise with mise_toml input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with mise.toml
        run: |
          mkdir -p /tmp/mise-test-workdir
          cat > /tmp/mise-test-workdir/mise.toml << 'EOF'
          [tools]
          node = "20.0.0"
          EOF
      - id: mise
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "20.0.0"
          install: "true"
          cache: "false"
          working_directory: /tmp/mise-test-workdir
      - name: Assert node is installed via mise.toml
        run: |
          if ! command -v node &>/dev/null; then
            echo "FAIL: node binary not found in PATH"
            exit 1
          fi
          NODE_VER="$(node --version)"
          echo "node version: $NODE_VER"
          if [[ "$NODE_VER" != v20* ]]; then
            echo "FAIL: expected node v20.x, got $NODE_VER"
            exit 1
          fi
          echo "PASS: node $NODE_VER installed via mise.toml"
      - name: Assert versions output is populated
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "versions: $VERSIONS"
          if [ -z "$VERSIONS" ]; then
            echo "FAIL: versions output is empty"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -q '"node"'; then
            echo "FAIL: versions output does not contain 'node'"
            exit 1
          fi
          echo "PASS: versions output contains node"
