name: Test mise tool install via mise_toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove existing mise lock file to avoid conflicts
        run: |
          rm -f mise.lock
      - id: mise
        uses: .
        with:
          mise_toml: |
            [tools]
            node = "22"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          which mise || { echo "FAIL: mise not found on PATH"; exit 1; }
          mise --version
          echo "PASS: mise is available"
      - name: Assert node was installed by mise
        run: |
          echo "Checking node is available..."
          which node || { echo "FAIL: node not found on PATH"; exit 1; }
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v22* ]]; then
            echo "FAIL: expected node v22.x, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node $NODE_VERSION installed"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit output should be 'true' or 'false', got: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit output is valid"
