name: Test tool install and version outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          version: 2025.1.0
          cache: "false"
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert jq output
        env:
          ACTUAL: ${{ steps.mise.outputs.jq }}
          VERSIONS: ${{ steps.mise.outputs.versions }}
        run: |
          echo "jq: $ACTUAL"
          echo "versions: $VERSIONS"
          if [ "$ACTUAL" != "1.7.1" ]; then
            echo "FAIL: expected jq output '1.7.1'"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -q '"jq"'; then
            echo "FAIL: versions JSON missing jq"
            exit 1
          fi
          echo "PASS"
      - name: Assert jq usable in later steps
        run: |
          OUT="$(jq --version)"
          echo "jq --version: $OUT"
          if ! echo "$OUT" | grep -q '1.7.1'; then
            echo "FAIL: expected jq 1.7.1 on PATH"
            exit 1
          fi
          echo "PASS"
