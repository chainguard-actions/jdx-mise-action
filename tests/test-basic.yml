name: Test basic mise installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
      - name: Assert mise is on PATH
        run: |
          echo "Checking mise is available..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert mise version output
        run: |
          VERSION=$(mise --version 2>&1 || true)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty output"
            exit 1
          fi
          echo "PASS: mise version is $VERSION"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be false since we disabled cache
          if [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit=false, got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit is false as expected"
