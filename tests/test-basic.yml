name: Test basic usage with mise_toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: mise
        uses: .
        with:
          cache: false
          mise_toml: |
            [tools]
            jq = "1.7.1"

            [env]
            MY_ENV_VAR = "abc"
      - name: Assert mise is on PATH
        run: |
          mise --version || { echo "FAIL: mise not on PATH"; exit 1; }
          echo "PASS"
      - name: Assert jq installed
        run: |
          out="$(mise x jq -- jq --version)"
          echo "jq version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          which jq || { echo "FAIL: jq not on PATH via shims"; exit 1; }
          echo "PASS"
      - name: Assert env var exported
        run: |
          echo "MY_ENV_VAR=$MY_ENV_VAR"
          if [ "$MY_ENV_VAR" != "abc" ]; then
            echo "FAIL: expected MY_ENV_VAR=abc"
            exit 1
          fi
          echo "PASS"
      - name: Assert versions output
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          echo "versions: $VERSIONS"
          echo "cache-hit: $CACHE_HIT"
          if ! echo "$VERSIONS" | grep -q '"jq"'; then
            echo "FAIL: versions output does not include jq"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -q '1.7.1'; then
            echo "FAIL: versions output does not include 1.7.1"
            exit 1
          fi
          echo "PASS"
