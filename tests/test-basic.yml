name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "true"
          cache: "false"
          log_level: "info"
      - name: Assert mise is available
        run: |
          which mise || (echo "FAIL: mise not found in PATH" && exit 1)
          echo "PASS: mise is available"
      - name: Assert cache-hit output exists
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "PASS: cache-hit output is present"
