name: Test basic mise installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install: "false"
          cache: "false"
      - name: Assert mise is available
        run: |
          echo "Checking mise is in PATH..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found in PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available"
      - name: Assert cache-hit output is false when cache disabled
        env:
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit to be 'false' when cache is disabled, got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit output is 'false' as expected"
