name: Test basic mise installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
      - name: Assert mise is installed and on PATH
        run: |
          echo "which mise: $(which mise || echo 'not found')"
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either 'true' or 'false' (not empty)
          if [ -z "$CACHE_HIT" ]; then
            echo "FAIL: cache-hit output is empty"
            exit 1
          fi
          echo "PASS: cache-hit output is '$CACHE_HIT'"
