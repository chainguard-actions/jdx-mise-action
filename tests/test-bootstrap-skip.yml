name: Test mise with bootstrap_skip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bootstrap: "true"
          bootstrap_skip: "tools,task"
          cache: "false"
          env: "false"
        continue-on-error: true
      - name: Assert action ran with bootstrap_skip
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "step outcome: $OUTCOME"
          # bootstrap may fail if there's nothing to bootstrap in this repo,
          # but the input must be accepted (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: bootstrap_skip input was accepted by the action (outcome=$OUTCOME)"
      - name: Assert mise is on PATH
        run: |
          echo "mise path: $(which mise || echo 'not found')"
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
