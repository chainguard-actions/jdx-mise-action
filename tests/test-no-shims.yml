name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          add_shims_to_path: "false"
          install: "false"
          cache: "false"
      - name: Assert mise binary is still available (mise itself on PATH)
        run: |
          echo "Checking mise binary..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "PATH: $PATH"
          # The mise shims directory typically contains ~/.local/share/mise/shims
          if echo "$PATH" | grep -q "mise/shims"; then
            echo "FAIL: mise shims directory found in PATH despite add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory is not in PATH"
