name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          add_shims_to_path: "false"
      - name: Assert mise binary itself is still available
        run: |
          echo "Checking mise is on PATH..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise found at $(command -v mise)"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "Checking PATH does not contain mise shims..."
          MISE_SHIMS="${HOME}/.local/share/mise/shims"
          echo "PATH: $PATH"
          echo "Expected shims dir: $MISE_SHIMS"
          if echo "$PATH" | grep -q "$MISE_SHIMS"; then
            echo "FAIL: mise shims directory found in PATH when add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory is not in PATH"
