name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          add_shims_to_path: "false"
          install: "false"
      - name: Assert mise binary is available
        run: |
          echo "Checking mise binary..."
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          MISE_VERSION="$(mise --version)"
          echo "mise version: $MISE_VERSION"
          echo "PASS: mise binary is available"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "Checking PATH for mise shims..."
          echo "PATH: $PATH"
          MISE_SHIMS_DIR="${HOME}/.local/share/mise/shims"
          if echo "$PATH" | grep -q "$MISE_SHIMS_DIR"; then
            echo "FAIL: mise shims directory found in PATH when add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory not in PATH as expected"
