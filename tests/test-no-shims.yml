name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory for mise
        run: mkdir -p /tmp/mise-test-workdir
      - id: mise
        uses: .
        with:
          add_shims_to_path: "false"
          install: "false"
          cache: "false"
          working_directory: /tmp/mise-test-workdir
      - name: Assert mise is installed
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise binary not found in PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is installed"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "PATH: $PATH"
          SHIMS_DIR="$HOME/.local/share/mise/shims"
          if echo "$PATH" | grep -q "$SHIMS_DIR"; then
            echo "FAIL: mise shims directory '$SHIMS_DIR' found in PATH but add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory is not in PATH (add_shims_to_path=false)"
