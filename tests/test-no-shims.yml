name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean working directory
        run: mkdir -p /tmp/mise-test-no-shims
      - id: mise
        uses: .
        with:
          add_shims_to_path: "false"
          install: "false"
          cache: "false"
          working_directory: /tmp/mise-test-no-shims
      - name: Assert mise binary itself is still available
        run: |
          echo "Checking mise binary is available..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise binary is available even with add_shims_to_path=false"
      - name: Assert shims directory is not in PATH
        run: |
          echo "PATH: $PATH"
          SHIMS_DIR="$HOME/.local/share/mise/shims"
          if echo "$PATH" | grep -q "$SHIMS_DIR"; then
            echo "FAIL: shims directory '$SHIMS_DIR' found in PATH but add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: shims directory not in PATH as expected"
