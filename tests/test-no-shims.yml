name: Test mise with shims disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          install: "false"
          add_shims_to_path: "false"
          working_directory: /tmp
      - name: Assert mise binary is still available
        run: |
          echo "Checking mise is available..."
          which mise || { echo "FAIL: mise not found on PATH"; exit 1; }
          mise --version
          echo "PASS: mise binary is available even with add_shims_to_path=false"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "PATH: $PATH"
          SHIMS_DIR="$HOME/.local/share/mise/shims"
          echo "Expected shims dir: $SHIMS_DIR"
          if echo "$PATH" | grep -q "$SHIMS_DIR"; then
            echo "FAIL: shims directory should not be in PATH when add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: shims directory is not in PATH as expected"
