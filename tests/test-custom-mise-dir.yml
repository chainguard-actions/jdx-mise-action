name: Test mise with custom mise_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean working directory
        run: mkdir -p /tmp/mise-test-custom-dir
      - id: mise
        uses: .
        with:
          mise_dir: "/tmp/custom-mise-dir"
          install: "false"
          cache: "false"
          working_directory: /tmp/mise-test-custom-dir
      - name: Assert mise is available
        run: |
          echo "Checking mise is available..."
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "mise version: $(mise --version)"
          echo "PASS: mise is available"
      - name: Assert MISE_DATA_DIR is set to custom directory
        run: |
          echo "MISE_DATA_DIR: $MISE_DATA_DIR"
          if [ "$MISE_DATA_DIR" != "/tmp/custom-mise-dir" ]; then
            echo "FAIL: expected MISE_DATA_DIR=/tmp/custom-mise-dir but got: $MISE_DATA_DIR"
            exit 1
          fi
          echo "PASS: MISE_DATA_DIR is set to custom directory"
      - name: Assert custom mise_dir exists
        run: |
          if [ ! -d "/tmp/custom-mise-dir" ]; then
            echo "FAIL: custom mise_dir /tmp/custom-mise-dir does not exist"
            exit 1
          fi
          echo "PASS: custom mise_dir exists"
