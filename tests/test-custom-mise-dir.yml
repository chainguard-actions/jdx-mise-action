name: Test mise with custom mise_dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          mise_dir: "/tmp/custom-mise-dir"
          fetch_from_github: "false"
      - name: Assert mise is on PATH
        run: |
          if ! command -v mise &>/dev/null; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert mise was installed to custom directory
        run: |
          echo "Checking custom mise dir..."
          ls -la /tmp/custom-mise-dir/bin/ || echo "Directory listing failed"
          if [ ! -f "/tmp/custom-mise-dir/bin/mise" ]; then
            echo "FAIL: mise binary not found in custom directory /tmp/custom-mise-dir/bin/mise"
            exit 1
          fi
          echo "PASS: mise binary found in custom directory"
      - name: Assert mise version works
        run: |
          VERSION=$(mise --version)
          echo "mise version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: mise --version returned empty"
            exit 1
          fi
          echo "PASS: mise is functional from custom dir"
