name: Test mise with shims not added to PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: "false"
          cache: "false"
          env: "false"
          add_shims_to_path: "false"
      - name: Assert mise is on PATH (mise bin dir is always added)
        run: |
          if ! which mise; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is on PATH"
      - name: Assert mise shims directory is not in PATH
        run: |
          echo "PATH: $PATH"
          MISE_SHIMS_DIR="$HOME/.local/share/mise/shims"
          echo "Expected shims dir: $MISE_SHIMS_DIR"
          if echo "$PATH" | tr ':' '\n' | grep -qF "$MISE_SHIMS_DIR"; then
            echo "FAIL: mise shims directory should not be in PATH when add_shims_to_path=false"
            exit 1
          fi
          echo "PASS: mise shims directory is not in PATH as expected"
