name: Test installing a tool from mise_toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove repo lockfile so it does not interfere with the test config
        run: rm -f "$GITHUB_WORKSPACE/mise.lock" "$GITHUB_WORKSPACE/.mise.toml"
      - id: mise
        uses: .
        with:
          cache: false
          version: 2025.7.3
          sha256: d38d4993c5379a680b50661f86287731dc1d1264777880a79b786403af337948
          mise_dir: ${{ runner.temp }}/mise-install-data
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert jq 1.7.1 installed via mise
        run: |
          OUT="$(mise x -- jq --version)"
          echo "jq --version: $OUT"
          if ! echo "$OUT" | grep -q "1.7.1"; then
            echo "FAIL: expected jq 1.7.1"
            exit 1
          fi
          ls "$MISE_DATA_DIR/installs" || true
          echo "PASS"
      - name: Assert cache-hit is not true
        env:
          ACTUAL: ${{ steps.mise.outputs.cache-hit }}
        run: |
          echo "cache-hit: $ACTUAL"
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: cache disabled, cache-hit should not be true"
            exit 1
          fi
          echo "PASS"
      - name: Assert versions output mentions jq 1.7.1
        env:
          VERSIONS: ${{ steps.mise.outputs.versions }}
          JQ_OUT: ${{ steps.mise.outputs.jq }}
        run: |
          echo "versions: $VERSIONS"
          echo "jq output: $JQ_OUT"
          if ! echo "$VERSIONS" | grep -q '"jq"'; then
            echo "FAIL: versions output does not contain jq"
            exit 1
          fi
          if ! echo "$VERSIONS" | grep -q '1.7.1'; then
            echo "FAIL: versions output does not contain jq 1.7.1"
            exit 1
          fi
          echo "PASS"
