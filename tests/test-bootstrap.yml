name: Test bootstrap with skip and args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: mise
        uses: .
        with:
          cache: false
          bootstrap: true
          bootstrap_skip: task
          bootstrap_args: --yes
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert mise available and jq bootstrapped
        run: |
          mise --version || { echo "FAIL: mise not on PATH"; exit 1; }
          out="$(mise x jq -- jq --version)"
          echo "jq version: $out"
          if [ "$out" != "jq-1.7.1" ]; then
            echo "FAIL: expected jq-1.7.1"
            exit 1
          fi
          echo "PASS"
