name: Test bootstrap_args and bootstrap_skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          bootstrap: "true"
          bootstrap_skip: "tools"
          bootstrap_args: "--yes"
          cache: "false"
        continue-on-error: true
      - name: Assert mise ran with bootstrap inputs
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "mise version: $(mise --version)"
            echo "PASS: mise bootstrap ran successfully with bootstrap_skip and bootstrap_args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (bootstrap may not be supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
