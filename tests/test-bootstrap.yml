name: Test bootstrap with bootstrap_skip and bootstrap_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove repo mise config so only the mise_toml input applies
        run: rm -rf "$GITHUB_WORKSPACE/mise.lock" "$GITHUB_WORKSPACE/.mise.toml" "$GITHUB_WORKSPACE/.mise"
      - id: mise
        uses: .
        with:
          cache: false
          # version unset: newest release at least 24h old (bootstrap needs a recent mise)
          mise_dir: ${{ runner.temp }}/mise-bootstrap-data
          bootstrap: true
          bootstrap_skip: task
          bootstrap_args: --yes
          mise_toml: |
            [tools]
            jq = "1.7.1"
      - name: Assert mise is available
        run: |
          mise --version
          echo "PASS"
      - name: Assert jq installed by bootstrap
        run: |
          OUT="$(mise x -- jq --version)"
          echo "jq --version: $OUT"
          if ! echo "$OUT" | grep -q "1.7.1"; then
            echo "FAIL: expected jq 1.7.1"
            exit 1
          fi
          echo "PASS"
