name: Test bootstrap inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          bootstrap: "true"
          bootstrap_skip: "tools,task"
          bootstrap_args: "--help"
          cache: "false"
        continue-on-error: true
      - name: Assert mise ran (bootstrap with skip)
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # bootstrap --help may succeed or fail depending on mise version,
          # but the action should have attempted to run
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with bootstrap inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert mise is available
        if: steps.mise.outcome == 'success'
        run: |
          if ! command -v mise >/dev/null 2>&1; then
            echo "FAIL: mise not found on PATH"
            exit 1
          fi
          echo "PASS: mise is available"
