name: Test bootstrap_args and bootstrap_skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          bootstrap: "true"
          bootstrap_skip: "tools"
          bootstrap_args: ""
          cache: "false"
        continue-on-error: true
      - name: Assert action ran with bootstrap inputs
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # bootstrap mode may succeed or fail depending on the repo's mise config
          # We just verify the action accepted the inputs and ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled bootstrap_args and bootstrap_skip inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert mise is available when action succeeded
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v mise &>/dev/null; then
              echo "FAIL: mise not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: mise is available"
          else
            echo "SKIP: action did not succeed (bootstrap may require specific repo config)"
          fi
