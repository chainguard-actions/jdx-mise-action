name: Test bootstrap_args and bootstrap_skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: mise
        uses: .
        with:
          bootstrap: "true"
          bootstrap_skip: "tools"
          bootstrap_args: "--verbose"
          cache: "false"
        continue-on-error: true
      - name: Assert action ran with bootstrap inputs
        env:
          OUTCOME: ${{ steps.mise.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # bootstrap mode may succeed or fail depending on mise version support
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: bootstrap mode succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bootstrap mode failed gracefully (may not be supported in this version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
